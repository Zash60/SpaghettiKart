name: Scattershot Headless

on:
  workflow_dispatch:
    inputs:
      time:
        description: 'Time budget seconds'
        required: false
        default: '60'
      threads:
        description: 'Threads'
        required: false
        default: '8'
  push:
    branches: [ "main" ]
    paths:
      - 'tools/mk64-scattershot/**'
      - '.github/workflows/scattershot.yml'

jobs:
  scattershot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-scattershot-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-scattershot-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: spaghettikart-builder:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build headless scattershot
        run: |
          docker run --rm -v "${{ github.workspace }}:/project" spaghettikart-builder:latest bash -c "
            cmake -S /project -B /project/build-headless -G Ninja -DSCATTERSHOT_HEADLESS=ON -DCMAKE_BUILD_TYPE=Release && \
            cmake --build /project/build-headless -j\$(nproc) && \
            ls -lh /project/build-headless/tools/mk64-scattershot/mk64-scattershot
          "

      - name: Run scattershot (real physics)
        run: |
          docker run --rm -v "${{ github.workspace }}:/project" spaghettikart-builder:latest bash -c "
            apt-get update -y && apt-get install -y gdb >/dev/null 2>&1 || true; \
            mkdir -p /project/out && \
            gdb -batch -ex run -ex bt --args /project/build-headless/tools/mk64-scattershot/mk64-scattershot --course mario_raceway --time ${{ inputs.time || '60' }} --threads ${{ inputs.threads || '8' }} --out /project/out; \
            ls -lh /project/out/ && cat /project/out/best.json || true
          "

      - name: Fix permissions
        run: sudo chown -R $(id -u):$(id -g) build-headless out || true

      - name: Upload scattershot artifact
        uses: actions/upload-artifact@v4
        with:
          name: scattershot-mario-raceway
          path: |
            out/best.mkr
            out/best.json
          retention-days: 7

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
